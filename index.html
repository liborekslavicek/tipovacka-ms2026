<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
.container { max-width:1200px; margin:auto; padding:20px; }

h1 { text-align:center; }

.menu { text-align:center; margin-bottom:20px; }

/* ANIMACE TABULKY */

  from { opacity:0; transform:translateY(10px); }

}

table {
  width:100%;

  background:white;

}

.table-wrapper{

.yes { color:green; font-weight:bold; }
.no { color:red; }

.button {

.big-button:hover{

function formatCZ(date){
  return date.toLocaleDateString("cs-CZ") + " " +
         date.toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});

async function loadTop10(){

  try{

    const res = await fetch(API + "?action=poradi&key=" + API_KEY);
    const data = await res.json();

    if(!Array.isArray(data) || data.length < 2) return;

    let text = "";

    for(let i = 1; i < Math.min(11, data.length); i++){

      const poradi = i;
      const jmeno = data[i][1];
      const body = data[i][2];

      const medal =
  poradi === 1 ? "🥇" :
  poradi === 2 ? "🥈" :
  poradi === 3 ? "🥉" :
  "🏅 " + poradi + ".";

      text += `
        ${medal} ${jmeno} (${body} b)
        &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;
      `;
    }

    document.getElementById("top10Ticker").innerHTML = `
      <div class="top10-ticker">
        <div class="top10-track">
          ${text}
        </div>
      </div>
    `;

  }catch(err){
    console.error("TOP10:", err);
  }
}

// ===== COUNTDOWN =====
function startCountdown(el){
  function update(){
    const now = new Date();
    const diff = deadlineGlobal - now;

    if(diff <= 0){

  el.innerHTML = "🔒 Tipy jsou uzavřené";
  return;
}

    const h = Math.floor(diff/1000/60/60);
    const m = Math.floor(diff/1000/60)%60;
    const s = Math.floor(diff/1000)%60;

    el.innerHTML = `⏳ ${h}h ${m}m ${s}s`;
  }

  update();
  setInterval(update,1000);
}

// ===== LOAD =====
async function load(type, btn=null){

  if(isLoading) return;
  isLoading = true;

  try{

    currentTab = type;
    setActive(btn);

    if(type==="uvod"){
      await loadUvod();
      return;
    }

    if(type==="rozpisko"){
      document.getElementById("content").innerHTML = `
  <h2>📊 Rozpis play-off</h2>

  <div style="text-align:center">

    <a href="https://soccer2026.app/bracket"
       target="_blank"
       title="World Cup 2026 Bracket">

      <img
        src="https://soccer2026.app/images/bracket/world-cup-2026-bracket-en.png"
        alt="World Cup 2026 Bracket"
        style="
          width:100%;
          max-width:1100px;
          border-radius:10px;
          box-shadow:0 3px 10px rgba(0,0,0,.15);
        ">

    </a>

    <div style="
      font-size:12px;
      color:#777;
      margin-top:8px;">
      Zdroj:
      <a href="https://soccer2026.app/bracket"
         target="_blank">
         Bola 2026
      </a>
    </div>

  </div>
`;
      return;
    }

if(type==="statistiky"){
  await loadStatistiky();
  return;
}

    const res = await fetch(API + "?action=" + type + "&key=" + API_KEY);
    const data = await res.json();

    
    if(data.hidden){

      const resD = await fetch(API + "?action=deadline&key=" + API_KEY);
      const raw = await resD.json();
      const d = new Date(raw);

      deadlineGlobal = d;

      document.getElementById("content").innerHTML = `
        <h2>🔒 Tipy budou zobrazeny po uzávěrce</h2>
        <p class="deadline">${formatCZ(d)}</p>
        <div id="countdown" class="countdown"></div>
      `;

      startCountdown(document.getElementById("countdown"));
      return;
    }

    if(!Array.isArray(data)){
      document.getElementById("content").innerHTML = `
        <h2>❌ Chyba načítání dat</h2>
        <pre>${JSON.stringify(data,null,2)}</pre>
      `;
      return;
    }

    let html = "";

    if(type==="tipy" || type==="tipyko"){
  html += `
  <div style="text-align:center;margin-bottom:15px;">
    <input
      type="text"
      id="filterInput"
      autocomplete="off"
      placeholder="🔍 Hledat hráče, tým..."
      style="
        width:350px;
        max-width:90%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
      ">
  </div>`;
}

    html += "<div class='table-wrapper'><table id='dataTable'>";

    data.forEach((row,i)=>{

      if(type==="zapasy"){
        row = row.filter((_,index)=>index!==1);
      }

      if(type==="playoff"){
        if(i===0){
          row[2] = "Postup";
        }else{
          row[2] = row[2] === true
            ? '<span class="yes">ANO</span>'
            : '<span class="no">NE</span>';
        }
      }

      if(type==="hraci" && i>0){
        row[2] = row[2]==="ANO"
          ? '<span class="check">✔</span>'
          : '<span class="cross">✖</span>';

        row[3] = row[3] + " Kč";
      }

      if(type==="poradi" && i>0){

        if(row[8] != null){
          row[8] = (row[8]*100)
            .toFixed(2)
            .replace(".",",") + " %";
        }

        if(row[9] != null){
          row[9] = Number(row[9])
            .toLocaleString("cs-CZ") + " Kč";
        }
      }

      let cls="";

      if(type==="poradi" && i===1){
        cls="gold";
        row[0]="🥇";
      }

      if(type==="poradi" && i===2){
        cls="silver";
        row[0]="🥈";
      }

      if(type==="poradi" && i===3){
        cls="bronze";
        row[0]="🥉";
      }

      if(i===0){
        cls="header-row";
      }

      html += `<tr class="${cls}">`;

      row.forEach(cell=>{
        html += `<td>${cell ?? ""}</td>`;
      });

      html += "</tr>";
    });

    html += "</table></div>";

    document.getElementById("content").innerHTML = html;

const filter = document.getElementById("filterInput");

if(filter){

  filter.focus();

  filter.addEventListener("input", function(){
    filterTable();
  });

}
  }catch(err){

    console.error(err);

    document.getElementById("content").innerHTML = `
      <h2>❌ JavaScript chyba</h2>
      <pre>${err.message}</pre>
    `;
  }
  finally{
    isLoading = false;

function showStat(start,title){

    let html=`
        <h2>${title}</h2>

        <div class="table-wrapper">
        <table>

        <tr class="header-row">
            <td>Pořadí</td>
            <td>Jméno</td>
            <td>Počet</td>
        </tr>
    `;

    for(let i=2;i<window.statData.length;i++){

        if(!window.statData[i][start+1]) continue;

        html+=`
        <tr>

            <td>${window.statData[i][start]}</td>

            <td style="text-align:left">
                ${window.statData[i][start+1]}
            </td>

            <td>
                <b>${window.statData[i][start+2]}</b>
            </td>

        </tr>
        `;
    }

    html+=`
        </table>
        </div>

        <div style="text-align:center;margin-top:20px;">

            <button class="button"
                onclick="load('statistiky')">

                ← Zpět

            </button>

        </div>
    `;

    document.getElementById("content").innerHTML=html;

}
// ===== FILTER =====
function filterTable(){

  const filter = document.getElementById("filterInput");

  if(!filter) return;

  const value = filter.value.toLowerCase();

  const table = document.getElementById("dataTable");

  if(!table) return;

  const rows = table.querySelectorAll("tr");

  rows.forEach((row,index)=>{

    if(index === 0) return;

    const text = row.textContent.toLowerCase();

    row.style.display =
      text.includes(value)
      ? ""
      : "none";

  });
}

function getVisitorId(){
  let id = localStorage.getItem("visitor_id");
  if(!id){
    id = Math.random().toString(36).substring(2);
    localStorage.setItem("visitor_id", id);
  }
  return id;
}

async function trackVisit(){

  const firstVisit = !sessionStorage.getItem("visited");

  const id = getVisitorId();

  const res = await fetch(API + "?action=visit&id=" + id + "&first=" + firstVisit + "&key=" + API_KEY);
  const data = await res.json();

  const el = document.getElementById("visitStats");
  if(!el) return;

  el.innerHTML = `
  <div style="
    text-align:center;
    font-size:16px;
    line-height:1.8;
    background:#f5f7fb;
    padding:10px;
    border-radius:8px;
    display:inline-block;
  ">
    👀 dnešní počet návštěvníků  <strong>${data.today}</strong> <br>
    📊 celkový počet návštěvníků  <strong>${data.total}</strong> <br>
     </div>
`;

  if(firstVisit){
    sessionStorage.setItem("visited","1");
  }
}
